# Perpetua governance contract — standalone Cargo project.
#
# Timelocked multi-sig governance for Perpetua protocol parameters: admin +
# co-signer proposal flow with a fixed approval threshold, timelock, expiry
# and execution of opaque calldata against a target contract.
#
# Standalone project, no shared workspace:
#
#   cargo build --target wasm32v1-none --release
#   cargo test

[workspace]
resolver = "2"
members = ["."]

[package]
name = "fluxora-governance"
description = "Timelocked multi-sig governance for Perpetua protocol parameters"
version = "1.0.0"
edition = "2021"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/hannyloveworld/Perpetua-Contracts"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = "27.0.5"

[dev-dependencies]
soroban-sdk = { version = "27.0.5", features = ["testutils"] }
fluxora-factory = { path = "../factory" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true