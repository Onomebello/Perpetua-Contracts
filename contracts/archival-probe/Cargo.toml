# Perpetua archival probe — standalone Cargo project.
#
# Isolation decision (issue #1543): this is a deliberate EXCEPTION to the
# "contracts/* are the deployable product" rule. It is a throwaway probe that
# proves the Soroban archival/restore flow. It is intentionally NOT part of the
# product and MUST never be released or deployed to mainnet.
#
# It is its own independent Cargo project (no shared workspace), so it can be
# built and tested on its own without ever leaking into a product build:
#
#   cargo build --target wasm32v1-none --release
#   cargo test
#
# Purpose-built and archived from product releases by script/release.sh, which
# builds only the `fluxora-stream` package and refuses to ship this probe.

[workspace]
resolver = "2"
members = ["."]

[package]
name = "fluxora-archival-probe"
description = "Throwaway probe that proves the Soroban archival/restore flow. NOT part of the product; excluded from release artifacts."
version = "1.0.0"
edition = "2021"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/hannyloveworld/Perpetua-Contracts"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = "27.0.5"

[dev-dependencies]
soroban-sdk = { version = "27.0.5", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true