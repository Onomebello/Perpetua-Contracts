# Perpetua stream contract — standalone Cargo project.
#
# This crate no longer belongs to a shared workspace: it is its own project
# with its own lockfile, so it can be built and released on its own.
#
#   cargo build  --target wasm32v1-none --release   # -> fluxora_stream.wasm
#   cargo test                                      # full suite (host target)
#
# soroban-sdk's major version tracks the Stellar protocol version; do not
# upgrade past the protocol the target network actually runs. Protocol 27 is
# live on both testnet and mainnet as of 2026-08.

[workspace]
resolver = "2"
members = ["."]

[package]
name = "fluxora-stream"
description = "Continuous payment streaming primitive for Soroban"
version = "1.0.0"
edition = "2021"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/hannyloveworld/Perpetua-Contracts"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = "27.0.6"

[dev-dependencies]
soroban-sdk = { version = "27.0.6", features = ["testutils"] }
proptest = "1"
# Used by the packaging tests to parse `cargo metadata` JSON output.
# Only a dev-dependency; never compiled into the contract WASM.
serde_json = { version = "1.0.140", default-features = false, features = ["std"] }

# Issue #117 — WASM size reduction below 40 KiB.
# Every knob below exists to shrink the compiled stream wasm:
#   opt-level "z"      -> optimize for size, not speed
#   lto "fat"          -> whole-crate inlining across codegen units
#   codegen-units 1    -> single unit so LTO has the full picture
#   panic "abort"      -> no unwinding tables in the wasm
#   strip "symbols"    -> drop name section / debug symbols
#   debug 0            -> no debuginfo
# Size is enforced on CI by script/check-stream-wasm-size.sh against
# wasm-size-budget.env (target 40 KiB). Do not regress it.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0
debug-assertions = false
overflow-checks = true
incremental = false

[profile.release-with-logs]
inherits = "release"
debug-assertions = true