# Perpetua stream-NFT — SEP-11 / NFT token wrapper over stream recipient
# claims. Standalone Cargo project so it can be built and deployed on its own.
#
#   cargo build  --target wasm32v1-none --release   # -> stream_nft.wasm
#   cargo test                                      # host unit tests
#
# Surface-level scaffold (#123). Approvals (approve / transfer_from), a full
# balance enumeration and an indexer-friendly events surface are follow-ups.

[workspace]
resolver = "2"
members = ["."]

[package]
name = "perpetua-stream-nft"
description = "SEP-11 / NFT wrapper representing Perpetua stream recipient claims"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/hannyloveworld/Perpetua-Contracts"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = "27.0.5"

[dev-dependencies]
soroban-sdk = { version = "27.0.5", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true